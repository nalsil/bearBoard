# ============================================================
# Bear Application JMeter Properties
# ============================================================
# 이 파일을 사용하여 테스트 설정을 커스터마이즈할 수 있습니다.
# 사용법: jmeter -p jmeter.properties -t bear-performance-test.jmx
# ============================================================

# ============================================================
# 서버 설정
# ============================================================
server.host=localhost
server.port=8080
protocol=http

# ============================================================
# 테스트 데이터 설정
# DB에 존재하는 실제 데이터로 변경하세요
# ============================================================
company.code=demo-company
sample.product.id=1
sample.post.id=1
sample.qna.id=1
sample.youtube.id=1
board.type=notice
product.category=electronics
faq.category=general
search.keyword=test

# ============================================================
# Load Test 설정
# ============================================================
load.threads=10
load.rampup=30
load.duration=300

# ============================================================
# Stress Test 설정
# ============================================================
stress.threads=50
stress.rampup=60
stress.duration=600

# ============================================================
# Spike Test 설정
# ============================================================
spike.threads=200
spike.rampup=10
spike.duration=180

# ============================================================
# JMeter 성능 설정
# ============================================================
# 힙 메모리 설정 (jmeter.bat/jmeter.sh에서 설정)
# HEAP="-Xms1g -Xmx4g"

# 결과 샘플링 설정
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.subresults=true
jmeter.save.saveservice.assertions=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.filename=false
jmeter.save.saveservice.hostname=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.idle_time=true

# HTTP 샘플러 설정
httpclient4.retrycount=0
httpclient.timeout=30000

# 스레드 그룹 설정
jmeterengine.stopfail.system.exit=true
