<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${company != null ? company.description : '기업 홈페이지'}">
    <title th:text="${pageTitle != null ? pageTitle + ' - ' + (company != null ? company.name : '홈페이지') : (company != null ? company.name : '홈페이지')}">홈페이지</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">

    <!-- 추가 CSS 삽입 위치 -->
    <th:block layout:fragment="additional_css"></th:block>
</head>
<body>
    <!-- 헤더 -->
    <header th:fragment="header" class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a th:href="@{/{code}(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="logo-link">
                        <img th:if="${company.logoUrl}" th:src="${company.logoUrl}" th:alt="${company.name} + ' 로고'" class="logo-image">
                        <span th:unless="${company.logoUrl}" th:text="${company.name}" class="logo-text">회사명</span>
                    </a>
                </div>

                <!-- 모바일 메뉴 토글 버튼 -->
                <button class="mobile-menu-toggle" aria-label="메뉴" onclick="toggleMobileMenu()">
                    <span class="hamburger"></span>
                    <span class="hamburger"></span>
                    <span class="hamburger"></span>
                </button>

                <!-- 네비게이션 -->
                <nav class="nav" id="mainNav">
                    <ul class="nav-list">
                        <li class="nav-item"><a th:href="@{/{code}(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">홈</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/about(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">회사 소개</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/products(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">상품</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/board/notice(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">공지사항</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/board/press(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">보도자료</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/faq(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">FAQ</a></li>
                        <li class="nav-item"><a th:href="@{/{code}/qna(code=${company != null ? company.code : ''})}" th:if="${company != null}" class="nav-link">문의하기</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main layout:fragment="content" class="main-content">
        <!-- 각 페이지의 컨텐츠가 여기에 삽입됩니다 -->
    </main>

    <!-- 푸터 -->
    <footer th:fragment="footer" class="footer">
        <div class="container">
            <div class="footer-content">
                <!-- 회사 정보 -->
                <div class="footer-section footer-info" th:if="${company != null}">
                    <h3 class="footer-title" th:text="${company.name}">회사명</h3>
                    <div class="footer-details">
                        <p th:if="${company.address}">
                            <svg class="footer-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 0a4 4 0 0 0-4 4c0 2.5 4 8 4 8s4-5.5 4-8a4 4 0 0 0-4-4zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
                            </svg>
                            <span th:text="${company.address}">주소</span>
                        </p>
                        <p th:if="${company.phone}">
                            <svg class="footer-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M3 2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2zm5 1a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1H8z"/>
                            </svg>
                            <span th:text="${company.phone}">전화</span>
                        </p>
                        <p th:if="${company.email}">
                            <svg class="footer-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555zM0 4.697v7.104l5.803-3.558L0 4.697zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757zm3.436-.586L16 11.801V4.697l-5.803 3.546z"/>
                            </svg>
                            <span th:text="${company.email}">이메일</span>
                        </p>
                    </div>
                </div>

                <!-- 빠른 링크 -->
                <div class="footer-section footer-links">
                    <h3 class="footer-title">빠른 링크</h3>
                    <ul class="footer-nav">
                        <li><a th:href="@{/{code}(code=${company != null ? company.code : ''})}" th:if="${company != null}">홈</a></li>
                        <li><a th:href="@{/{code}/about(code=${company != null ? company.code : ''})}" th:if="${company != null}">회사 소개</a></li>
                        <li><a th:href="@{/{code}/products(code=${company != null ? company.code : ''})}" th:if="${company != null}">상품</a></li>
                        <li><a th:href="@{/{code}/qna(code=${company != null ? company.code : ''})}" th:if="${company != null}">문의하기</a></li>
                    </ul>
                </div>

                <!-- 고객 지원 -->
                <div class="footer-section footer-support">
                    <h3 class="footer-title">고객 지원</h3>
                    <ul class="footer-nav">
                        <li><a th:href="@{/{code}/faq(code=${company != null ? company.code : ''})}" th:if="${company != null}">자주 묻는 질문</a></li>
                        <li><a th:href="@{/{code}/qna(code=${company != null ? company.code : ''})}" th:if="${company != null}">1:1 문의</a></li>
                        <li><a th:href="@{/{code}/board/notice(code=${company != null ? company.code : ''})}" th:if="${company != null}">공지사항</a></li>
                    </ul>
                </div>
            </div>

            <!-- 저작권 -->
            <div class="footer-bottom">
                <div class="footer-copyright">
                    <p th:text="'Copyright © ' + ${#temporals.year(#temporals.createNow())} + ' ' + ${company != null ? company.name : ''} + '. All rights reserved.'">
                        Copyright © 2025. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- 맨 위로 버튼 -->
    <button id="scrollToTop" class="scroll-to-top" onclick="scrollToTop()" aria-label="맨 위로">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
        </svg>
    </button>

    <!-- 공통 JavaScript -->
    <script th:src="@{/js/common.js}"></script>
    <script>
        // 모바일 메뉴 토글
        function toggleMobileMenu() {
            const nav = document.getElementById('mainNav');
            const toggle = document.querySelector('.mobile-menu-toggle');
            nav.classList.toggle('mobile-active');
            toggle.classList.toggle('active');
        }

        // 맨 위로 스크롤
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 스크롤 감지하여 맨 위로 버튼 표시/숨김
        window.addEventListener('scroll', function() {
            const scrollBtn = document.getElementById('scrollToTop');
            if (window.scrollY > 300) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });

        // 모바일 메뉴 외부 클릭 시 닫기
        document.addEventListener('click', function(event) {
            const nav = document.getElementById('mainNav');
            const toggle = document.querySelector('.mobile-menu-toggle');
            if (nav.classList.contains('mobile-active') &&
                !nav.contains(event.target) &&
                !toggle.contains(event.target)) {
                nav.classList.remove('mobile-active');
                toggle.classList.remove('active');
            }
        });
    </script>

    <!-- 추가 JavaScript 삽입 위치 -->
    <th:block layout:fragment="additional_js"></th:block>
</body>
</html>
