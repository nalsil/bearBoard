<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${company != null ? company.name + ' FAQ' : 'FAQ'}">
    <title th:text="${company != null ? company.name + ' - FAQ' : 'FAQ'}">FAQ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .faq-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 80px 0 100px;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .faq-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .faq-hero-content {
            position: relative;
            z-index: 1;
        }

        .faq-hero h1 {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .faq-hero p {
            font-size: 18px;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .faq-stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .faq-stat-item {
            text-align: center;
        }

        .faq-stat-number {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .faq-stat-label {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .faq-section {
            max-width: 900px;
            margin: -60px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .faq-filters {
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-tab {
            padding: 12px 24px;
            border: 2px solid #E5E7EB;
            background: #fff;
            color: #4B5563;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .filter-tab:hover {
            border-color: #D1D5DB;
            background: #F9FAFB;
            text-decoration: none;
        }

        .filter-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 56px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #F9FAFB;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            font-size: 18px;
        }

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .faq-item {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .faq-item:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: #F3F4F6;
        }

        .faq-item.active {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
        }

        .faq-question {
            padding: 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            font-weight: 600;
            color: #1F2937;
            user-select: none;
            position: relative;
        }

        .faq-question::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .faq-item.active .faq-question::before {
            opacity: 1;
        }

        .faq-question-text {
            flex: 1;
            font-size: 17px;
            line-height: 1.6;
            padding-left: 16px;
        }

        .faq-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            color: #6B7280;
        }

        .faq-item.active .faq-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .faq-answer-content {
            padding: 0 24px 24px;
            color: #4B5563;
            line-height: 1.8;
            font-size: 15px;
            padding-left: 56px;
        }

        .faq-category-tag {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .no-results {
            text-align: center;
            padding: 80px 40px;
            background: #fff;
            border-radius: 20px;
        }

        .no-results i {
            font-size: 80px;
            color: #D1D5DB;
            margin-bottom: 24px;
        }

        .no-results h3 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 12px;
        }

        .no-results p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 24px;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .faq-hero {
                padding: 60px 0 80px;
            }

            .faq-stats {
                gap: 24px;
            }

            .faq-stat-number {
                font-size: 32px;
            }

            .faq-section {
                margin-top: -40px;
            }

            .filter-tabs {
                gap: 8px;
            }

            .filter-tab {
                padding: 10px 16px;
                font-size: 13px;
            }

            .faq-question-text {
                font-size: 15px;
                padding-left: 12px;
            }

            .faq-answer-content {
                padding-left: 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <!-- 히어로 섹션 -->
        <div class="faq-hero">
            <div class="container">
                <div class="faq-hero-content">
                    <h1>자주 묻는 질문</h1>
                    <p>궁금하신 점을 빠르게 찾아보세요. 원하시는 정보를 쉽게 찾을 수 있습니다.</p>

                    <div class="faq-stats">
                        <div class="faq-stat-item">
                            <div class="faq-stat-number" th:text="${faqs != null ? #lists.size(faqs) : 0}">0</div>
                            <div class="faq-stat-label">전체 질문</div>
                        </div>
                        <div class="faq-stat-item">
                            <div class="faq-stat-number">24/7</div>
                            <div class="faq-stat-label">고객 지원</div>
                        </div>
                        <div class="faq-stat-item">
                            <div class="faq-stat-number">
                                <i class="fas fa-headset"></i>
                            </div>
                            <div class="faq-stat-label">전문 상담</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FAQ 섹션 -->
        <div class="faq-section">
            <!-- 필터 -->
            <div class="faq-filters">
                <!-- 카테고리 탭 -->
                <div class="filter-tabs">
                    <a th:href="@{/{code}/faq(code=${company.code})}"
                       th:class="${selectedCategory == null ? 'filter-tab active' : 'filter-tab'}">
                        <i class="fas fa-list"></i> 전체
                    </a>
                    <a th:each="cat : ${categories}"
                       th:href="@{/{code}/faq(code=${company.code}, category=${cat})}"
                       th:class="${selectedCategory == cat ? 'filter-tab active' : 'filter-tab'}"
                       th:text="${cat}">카테고리</a>
                </div>

                <!-- 검색 -->
                <form th:action="@{/{code}/faq(code=${company.code})}" method="get" class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" name="keyword" th:value="${keyword}"
                           placeholder="검색어를 입력하세요...">
                </form>
            </div>

            <!-- FAQ 목록 -->
            <div class="faq-list" th:if="${faqs != null and !faqs.isEmpty()}">
                <div class="faq-item" th:each="faq : ${faqs}">
                    <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">
                        <div class="faq-question-text">
                            <span class="faq-category-tag" th:if="${faq.category}" th:text="${faq.category}">카테고리</span>
                            <span th:text="${faq.question}">질문</span>
                        </div>
                        <div class="faq-toggle">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                    <div class="faq-answer">
                        <div class="faq-answer-content">
                            <p th:text="${faq.answer}">답변</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 결과 없음 -->
            <div class="no-results" th:if="${faqs == null or faqs.isEmpty()}">
                <i class="fas fa-question-circle"></i>
                <h3>찾으시는 질문이 없습니다</h3>
                <p>검색어를 변경하거나 다른 카테고리를 확인해보세요.<br>혹시 찾으시는 내용이 없다면 직접 문의해주세요.</p>
                <a th:href="@{/{code}/qna(code=${company.code})}" class="btn btn-primary" style="padding: 16px 36px;">
                    <i class="fas fa-envelope"></i> 1:1 문의하기
                </a>
            </div>

            <!-- 문의하기 CTA -->
            <div style="margin-top: 60px; text-align: center; padding: 40px; background: linear-gradient(135deg, #F9FAFB 0%, #fff 100%); border-radius: 20px; border: 2px solid #E5E7EB;">
                <h3 style="font-size: 24px; font-weight: 700; color: #1F2937; margin-bottom: 16px;">찾으시는 답이 없으신가요?</h3>
                <p style="font-size: 16px; color: #6B7280; margin-bottom: 24px; line-height: 1.8;">궁금한 점을 직접 문의해 주시면 빠르고 친절하게 답변드리겠습니다.</p>
                <a th:href="@{/{code}/qna(code=${company.code})}" class="btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px 36px; font-size: 16px; font-weight: 700;">
                    <i class="fas fa-paper-plane"></i> 문의하기
                </a>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        // URL 파라미터로부터 FAQ 아이템 열기
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const faqId = urlParams.get('faq');

            if (faqId) {
                const faqItem = document.querySelector(`.faq-item[data-faq-id="${faqId}"]`);
                if (faqItem) {
                    faqItem.classList.add('active');
                    faqItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        // 첫 번째 FAQ 자동 열기 (선택사항)
        const firstFaq = document.querySelector('.faq-item');
        if (firstFaq) {
            firstFaq.classList.add('active');
        }
    </script>
</body>
</html>
