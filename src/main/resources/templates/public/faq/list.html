<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${company != null ? company.name + ' FAQ' : 'FAQ'}">
    <title th:text="${company != null ? company.name + ' - FAQ' : 'FAQ'}">FAQ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <style>
        .faq-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .faq-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .faq-header h1 {
            font-size: 36px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 12px;
        }

        .faq-header p {
            font-size: 16px;
            color: #6B7280;
        }

        .faq-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            align-items: center;
        }

        .category-btn {
            padding: 10px 20px;
            border: 2px solid #E5E7EB;
            background: white;
            color: #4B5563;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .category-btn:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
            text-decoration: none;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .faq-header h1 {
                font-size: 28px;
            }

            .faq-filters {
                gap: 8px;
            }

            .category-btn {
                padding: 8px 16px;
                font-size: 14px;
            }

            .search-box {
                width: 100%;
                order: -1;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <div class="faq-section">
            <div class="faq-header">
                <h1>자주 묻는 질문 (FAQ)</h1>
                <p>자주 묻는 질문에 대한 답변을 확인하세요.</p>
            </div>

            <!-- 필터 및 검색 -->
            <div class="faq-filters">
                <a th:href="@{/{code}/faq(code=${company.code})}"
                   th:class="${selectedCategory == null ? 'category-btn active' : 'category-btn'}">전체</a>
                <a th:each="cat : ${categories}"
                   th:href="@{/{code}/faq(code=${company.code}, category=${cat})}"
                   th:class="${selectedCategory == cat ? 'category-btn active' : 'category-btn'}"
                   th:text="${cat}">카테고리</a>

                <form th:action="@{/{code}/faq(code=${company.code})}" method="get" class="search-box">
                    <input type="text" name="keyword" th:value="${keyword}"
                           placeholder="검색어를 입력하세요">
                </form>
            </div>

            <!-- FAQ 목록 -->
            <div class="faq-list" th:if="${faqs != null and !faqs.isEmpty()}">
                <div class="faq-item" th:each="faq : ${faqs}">
                    <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">
                        <h3 th:text="${faq.question}">질문</h3>
                        <span class="faq-toggle">▼</span>
                    </div>
                    <div class="faq-answer">
                        <p th:text="${faq.answer}">답변</p>
                    </div>
                </div>
            </div>

            <!-- 결과 없음 -->
            <div class="no-results" th:if="${faqs == null or faqs.isEmpty()}">
                <p>등록된 FAQ가 없습니다.</p>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
