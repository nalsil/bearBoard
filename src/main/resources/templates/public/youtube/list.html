<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${company != null ? company.name + ' 영상 갤러리' : '영상 갤러리'}">
    <title th:text="${company != null ? company.name + ' - 영상 갤러리' : '영상 갤러리'}">영상 갤러리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .youtube-hero {
            background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            padding: 80px 0;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .youtube-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .youtube-hero-content {
            position: relative;
            z-index: 1;
        }

        .youtube-hero h1 {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .youtube-hero p {
            font-size: 18px;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }

        .youtube-section {
            max-width: 1400px;
            margin: -60px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .youtube-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .youtube-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: #1F2937;
            margin: 0;
        }

        .youtube-stats {
            display: flex;
            gap: 20px;
            color: #6B7280;
            font-size: 14px;
        }

        .youtube-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
            margin-bottom: 60px;
        }

        .video-card {
            background: #fff;
            border: 2px solid #E5E7EB;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .video-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .video-card:hover {
            transform: translateY(-12px);
            border-color: transparent;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
        }

        .video-card:hover::before {
            opacity: 1;
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            overflow: hidden;
        }

        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .video-thumbnail img {
            transform: scale(1.08);
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(31, 41, 55, 0.8) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .video-card:hover .video-overlay {
            opacity: 1;
        }

        .video-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .video-card:hover .video-play-btn {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        .video-play-btn::before {
            content: '';
            width: 0;
            height: 0;
            border-left: 28px solid #FF0000;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            margin-left: 6px;
        }

        .video-duration {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            z-index: 2;
        }

        .video-info {
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
            color: #1F2937;
            margin: 0 0 12px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .video-card:hover .video-title {
            color: #667eea;
        }

        .video-description {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.6;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid #E5E7EB;
            margin-top: 16px;
            color: #9CA3AF;
            font-size: 13px;
        }

        .video-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .no-videos {
            text-align: center;
            padding: 100px 40px;
            background: #fff;
            border-radius: 20px;
        }

        .no-videos i {
            font-size: 100px;
            color: #D1D5DB;
            margin-bottom: 32px;
        }

        .no-videos h3 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 12px;
        }

        .no-videos p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .youtube-hero {
                padding: 60px 0;
            }

            .youtube-section {
                margin-top: -40px;
            }

            .youtube-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 20px;
            }

            .youtube-header h2 {
                font-size: 20px;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .video-play-btn {
                width: 64px;
                height: 64px;
            }

            .video-play-btn::before {
                border-left-width: 22px;
                border-top-width: 13px;
                border-bottom-width: 13px;
            }

            .video-info {
                padding: 20px;
            }

            .video-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <!-- 히어로 섹션 -->
        <div class="youtube-hero">
            <div class="container">
                <div class="youtube-hero-content">
                    <h1>영상 갤러리</h1>
                    <p>다양한 영상을 통해 저희의 제품과 서비스를 더 자세히 알아보세요.</p>
                </div>
            </div>
        </div>

        <!-- 영상 섹션 -->
        <div class="youtube-section">
            <!-- 헤더 -->
            <div class="youtube-header">
                <h2>동영상</h2>
                <div class="youtube-stats">
                    <span><i class="fas fa-video"></i> 총 <strong th:text="${videos != null ? #lists.size(videos) : 0}">0</strong>개</span>
                </div>
            </div>

            <!-- 영상 그리드 -->
            <div class="video-grid" th:if="${videos != null and !videos.isEmpty()}">
                <div class="video-card" th:each="video : ${videos}"
                     th:onclick="'location.href=\'' + @{/{code}/youtube/{id}(code=${company.code}, id=${video.id})} + '\''">
                    <div class="video-thumbnail">
                        <img th:if="${video.thumbnailUrl}"
                             th:src="${video.thumbnailUrl}"
                             th:alt="${video.title}">
                        <div th:unless="${video.thumbnailUrl}"
                             style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-play-circle" style="font-size: 64px; color: #9CA3AF;"></i>
                        </div>
                        <div class="video-play-btn"></div>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title" th:text="${video.title}">영상 제목</h3>
                        <p class="video-description" th:if="${video.description}"
                           th:text="${video.description}">영상 설명</p>
                        <div class="video-meta">
                            <span><i class="fas fa-clock"></i> <span th:text="${video.duration != null ? video.duration : '알 수 없음'}">영상 길이</span></span>
                            <span><i class="fas fa-calendar-alt"></i> <span th:text="${#temporals.format(video.createdAt, 'yyyy-MM-dd')}">등록일</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 영상 없음 -->
            <div class="no-videos" th:if="${videos == null or videos.isEmpty()}">
                <i class="fas fa-video-slash"></i>
                <h3>등록된 영상이 없습니다</h3>
                <p>아직 등록된 영상이 없습니다.<br>곧 다양한 영상으로 찾아뵙니다.</p>
                <a th:href="@{/{code}(code=${company.code})}" class="btn btn-primary" style="padding: 16px 36px;">
                    <i class="fas fa-home"></i> 홈으로 이동
                </a>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
