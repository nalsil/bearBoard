<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${video != null ? video.title : '영상 재생'}">
    <title th:text="${video != null ? video.title : '영상 재생'}">영상 재생</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .player-hero {
            background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
            padding: 60px 0;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .player-hero-content {
            position: relative;
            z-index: 1;
        }

        .player-hero h1 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .player-hero p {
            font-size: 16px;
            opacity: 0.95;
        }

        .player-section {
            max-width: 1200px;
            margin: -40px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .player-wrapper {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-details {
            padding: 40px;
            background: #F9FAFB;
        }

        .video-title {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            color: #1F2937;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .video-meta {
            display: flex;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 24px;
            flex-wrap: wrap;
            color: #6B7280;
            font-size: 14px;
        }

        .video-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .video-description {
            color: #374151;
            line-height: 1.9;
            font-size: 16px;
            white-space: pre-wrap;
            margin-bottom: 32px;
        }

        .player-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            padding-top: 32px;
            border-top: 2px solid #E5E7EB;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #1F2937;
            border: 2px solid #E5E7EB;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
            transform: translateY(-3px);
        }

        .error-message {
            text-align: center;
            padding: 100px 40px;
            background: #fff;
            border-radius: 20px;
        }

        .error-message i {
            font-size: 100px;
            color: #D1D5DB;
            margin-bottom: 24px;
        }

        .error-message h3 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .error-message p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .player-hero {
                padding: 40px 0;
            }

            .player-section {
                margin-top: -30px;
            }

            .video-details {
                padding: 28px 24px;
            }

            .video-title {
                font-size: 24px;
            }

            .video-description {
                font-size: 15px;
            }

            .player-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <!-- 히어로 섹션 -->
        <div class="player-hero" th:if="${video != null}">
            <div class="player-hero-content">
                <h1 th:text="${video.title}">영상 제목</h1>
                <p th:text="'등록일: ' + ${#temporals.format(video.createdAt, 'yyyy년 MM월 dd일')}">등록일</p>
            </div>
        </div>

        <!-- 플레이어 섹션 -->
        <div class="player-section" th:if="${video != null and videoId != null}">
            <div class="player-wrapper">
                <!-- 영상 플레이어 -->
                <div class="video-container">
                    <iframe th:src="'https://www.youtube.com/embed/' + ${videoId}"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                            title="YouTube video player">
                    </iframe>
                </div>

                <!-- 영상 정보 -->
                <div class="video-details">
                    <h2 class="video-title" th:text="${video.title}">영상 제목</h2>

                    <div class="video-meta">
                        <span th:if="${video.createdAt}">
                            <i class="fas fa-calendar-alt"></i>
                            <span th:text="${#temporals.format(video.createdAt, 'yyyy-MM-dd HH:mm')}">등록일</span>
                        </span>
                        <span th:if="${video.duration != null}">
                            <i class="fas fa-clock"></i>
                            <span th:text="${video.duration}">영상 길이</span>
                        </span>
                    </div>

                    <div class="video-description" th:if="${video.description}" th:text="${video.description}">영상 설명</div>
                </div>

                <!-- 액션 버튼 -->
                <div class="player-actions">
                    <a th:href="@{/{code}/youtube(code=${company.code})}" class="btn btn-secondary">
                        <i class="fas fa-th-large"></i>
                        목록으로
                    </a>
                    <button class="btn btn-primary" onclick="shareVideo()">
                        <i class="fas fa-share-alt"></i>
                        공유하기
                    </button>
                </div>
            </div>
        </div>

        <!-- 오류 메시지 -->
        <div class="error-message" th:if="${video == null or videoId == null}">
            <i class="fas fa-video-slash"></i>
            <h3>영상을 찾을 수 없습니다</h3>
            <p th:text="${message != null ? message : '요청하신 영상을 찾을 수 없습니다. 다시 시도하거나 관리자에게 문의해주세요.'}">
                요청하신 영상을 찾을 수 없습니다. 다시 시도하거나 관리자에게 문의해주세요.
            </p>
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a th:href="@{/{code}/youtube(code=${company.code})}" class="btn btn-primary">
                    <i class="fas fa-list"></i>
                    영상 목록
                </a>
                <a th:href="@{/{code}(code=${company.code})}" class="btn btn-secondary">
                    <i class="fas fa-home"></i>
                    홈으로
                </a>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(console.error);
            } else {
                const tempInput = document.createElement('input');
                tempInput.value = window.location.href;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                alert('링크가 복사되었습니다!');
            }
        }
    </script>
</body>
</html>
