<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null ? product.name + ' - ' + (company != null ? company.name : '') : '상품 상세'}">상품 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <style>
        .product-detail {
            max-width: 1000px;
            margin: 0 auto;
        }

        .product-detail-header {
            padding-bottom: 24px;
            border-bottom: 2px solid #E5E7EB;
            margin-bottom: 32px;
        }

        .product-detail-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 16px;
        }

        .product-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 14px;
            color: #6B7280;
        }

        .product-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .product-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .product-detail-body {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        .product-image-section {
            position: relative;
        }

        .product-main-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-image-placeholder {
            font-size: 18px;
            color: #9CA3AF;
            font-weight: 500;
        }

        .product-info-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .product-category-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #EFF6FF;
            color: #2563EB;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            width: fit-content;
        }

        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-top: 8px;
        }

        .product-description-section {
            padding: 24px;
            background: #F9FAFB;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
        }

        .product-description-section h3 {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
        }

        .product-description {
            font-size: 15px;
            line-height: 1.8;
            color: #4B5563;
            white-space: pre-wrap;
        }

        .product-specs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spec-item {
            display: flex;
            padding: 12px;
            background: #F9FAFB;
            border-radius: 6px;
            border: 1px solid #E5E7EB;
        }

        .spec-label {
            font-weight: 600;
            color: #374151;
            min-width: 100px;
        }

        .spec-value {
            color: #6B7280;
        }

        .product-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding-top: 32px;
            border-top: 1px solid #E5E7EB;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #2563EB;
            color: white;
        }

        .btn-primary:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        .error-message {
            text-align: center;
            padding: 60px 20px;
        }

        .error-message p {
            font-size: 18px;
            color: #6B7280;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <div class="container">
            <article class="product-detail" th:if="${product != null}">
                <!-- 상품 헤더 -->
                <header class="product-detail-header">
                    <h1 th:text="${product.name}">상품명</h1>
                    <div class="product-meta">
                        <span th:if="${product.category}">
                            📁 카테고리: <strong th:text="${product.category}">카테고리</strong>
                        </span>
                        <span th:if="${product.createdAt}">
                            📅 등록일: <span th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}">등록일</span>
                        </span>
                    </div>
                </header>

                <!-- 상품 본문 -->
                <div class="product-detail-body">
                    <!-- 이미지 섹션 -->
                    <div class="product-image-section">
                        <div class="product-main-image">
                            <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
                            <div th:unless="${product.imageUrl}" class="product-image-placeholder">
                                🖼️ 이미지 없음
                            </div>
                        </div>
                    </div>

                    <!-- 정보 섹션 -->
                    <div class="product-info-section">
                        <!-- 카테고리 -->
                        <div th:if="${product.category}">
                            <span class="product-category-badge" th:text="${product.category}">카테고리</span>
                        </div>

                        <!-- 가격 -->
                        <div th:if="${product.price}">
                            <div style="font-size: 14px; color: #6B7280; margin-bottom: 4px;">판매가</div>
                            <div class="product-price">
                                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">가격</span>원
                            </div>
                        </div>

                        <!-- 간단 설명 -->
                        <div th:if="${product.description}" class="product-description-section">
                            <h3>상품 설명</h3>
                            <p class="product-description" th:text="${product.description}">설명</p>
                        </div>

                        <!-- 추가 정보 -->
                        <div class="product-specs">
                            <div class="spec-item">
                                <span class="spec-label">상품 번호</span>
                                <span class="spec-value" th:text="${product.id}">ID</span>
                            </div>
                            <div class="spec-item" th:if="${product.updatedAt != null}">
                                <span class="spec-label">최종 수정일</span>
                                <span class="spec-value" th:text="${#temporals.format(product.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 목록으로 버튼 -->
                <div class="product-footer">
                    <a th:href="@{/{code}/products(code=${company.code})}"
                       class="btn btn-secondary">목록으로</a>
                </div>
            </article>

            <!-- 상품 없음 -->
            <div class="error-message" th:unless="${product != null}">
                <p th:text="${message != null ? message : '해당 상품을 찾을 수 없습니다.'}">상품을 찾을 수 없습니다</p>
                <a th:href="@{/{code}/products(code=${company.code})}"
                   class="btn btn-primary">목록으로</a>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
