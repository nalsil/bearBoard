<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null ? product.name + ' - ' + (company != null ? company.name : '') : '상품 상세'}">상품 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 0;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .detail-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .detail-hero h1 {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-section {
            max-width: 1200px;
            margin: -60px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .product-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .product-gallery {
            position: relative;
            background: #F9FAFB;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-main-image {
            width: 100%;
            aspect-ratio: 1;
            max-height: 500px;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .product-main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            font-size: 64px;
            color: #9CA3AF;
        }

        .product-info-wrapper {
            padding: 48px 40px;
        }

        .product-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid #E5E7EB;
        }

        .product-category-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .product-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            color: #1F2937;
            margin: 0 0 16px 0;
            line-height: 1.3;
        }

        .product-price-section {
            margin-bottom: 24px;
        }

        .product-price-label {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-price {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-description-section {
            background: #F9FAFB;
            padding: 32px;
            border-radius: 16px;
            border: 2px solid #E5E7EB;
            margin-bottom: 32px;
        }

        .product-description-section h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1F2937;
            margin: 0 0 16px 0;
        }

        .product-description {
            font-size: 16px;
            line-height: 1.9;
            color: #4B5563;
            white-space: pre-wrap;
        }

        .product-specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 20px;
            background: #F9FAFB;
            border-radius: 12px;
            border: 2px solid #E5E7EB;
        }

        .spec-label {
            font-size: 13px;
            font-weight: 700;
            color: #9CA3AF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spec-value {
            font-size: 16px;
            color: #1F2937;
            font-weight: 600;
        }

        .product-actions {
            display: flex;
            gap: 16px;
            padding-top: 32px;
            border-top: 2px solid #E5E7EB;
            margin-top: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #1F2937;
            border: 2px solid #E5E7EB;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
            transform: translateY(-3px);
        }

        .error-message {
            text-align: center;
            padding: 100px 40px;
            background: #fff;
            border-radius: 20px;
        }

        .error-message i {
            font-size: 100px;
            color: #D1D5DB;
            margin-bottom: 32px;
        }

        .error-message h3 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .error-message p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 32px;
        }

        @media (max-width: 1024px) {
            .product-wrapper {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .product-gallery {
                padding: 32px;
            }

            .product-info-wrapper {
                padding: 32px 24px;
            }

            .product-title {
                font-size: 32px;
            }

            .product-price {
                font-size: 48px;
            }

            .product-specs {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .detail-hero {
                padding: 40px 0;
            }

            .product-section {
                margin-top: -30px;
                padding: 0 16px;
            }

            .product-wrapper {
                border-radius: 16px;
                gap: 24px;
            }

            .product-gallery {
                padding: 24px;
            }

            .product-main-image {
                max-height: 400px;
            }

            .product-info-wrapper {
                padding: 24px 20px;
            }

            .product-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <!-- 히어로 섹션 -->
        <div class="detail-hero" th:if="${product != null}">
            <h1>상품 상세</h1>
        </div>

        <!-- 상품 섹션 -->
        <section class="product-section" th:if="${product != null}">
            <div class="product-wrapper">
                <!-- 이미지 섹션 -->
                <div class="product-gallery">
                    <div class="product-main-image">
                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}">
                        <div th:unless="${product.imageUrl}" class="image-placeholder">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                </div>

                <!-- 정보 섹션 -->
                <div class="product-info-wrapper">
                    <!-- 헤더 -->
                    <div class="product-header">
                        <div class="product-category-badge" th:if="${product.category}" th:text="${product.category}">카테고리</div>
                        <h2 class="product-title" th:text="${product.name}">상품명</h2>
                        <div class="product-price-section">
                            <div class="product-price-label">판매가</div>
                            <div class="product-price" th:if="${product.price}" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '원'">가격</div>
                        </div>
                    </div>

                    <!-- 설명 -->
                    <div class="product-description-section" th:if="${product.description}">
                        <h3>상품 설명</h3>
                        <p class="product-description" th:text="${product.description}">설명</p>
                    </div>

                    <!-- 스펙 -->
                    <div class="product-specs">
                        <div class="spec-item">
                            <div class="spec-label">상품 번호</div>
                            <div class="spec-value" th:text="${product.id}">ID</div>
                        </div>
                        <div class="spec-item" th:if="${product.updatedAt != null}">
                            <div class="spec-label">최종 수정일</div>
                            <div class="spec-value" th:text="${#temporals.format(product.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</div>
                        </div>
                        <div class="spec-item" th:if="${product.createdAt != null}">
                            <div class="spec-label">등록일</div>
                            <div class="spec-value" th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}">등록일</div>
                        </div>
                    </div>

                    <!-- 액션 -->
                    <div class="product-actions">
                        <a th:href="@{/{code}/products(code=${company.code})}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            목록으로
                        </a>
                        <a th:href="'tel:YOUR_PHONE_NUMBER'" class="btn btn-primary">
                            <i class="fas fa-phone-alt"></i>
                            문의하기
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- 오류 메시지 -->
        <div class="error-message" th:unless="${product != null}">
            <i class="fas fa-exclamation-circle"></i>
            <h3>상품을 찾을 수 없습니다</h3>
            <p th:text="${message != null ? message : '해당 상품을 찾을 수 없습니다. 삭제되었거나 잘못된 주소일 수 있습니다.'}">
                해당 상품을 찾을 수 없습니다. 삭제되었거나 잘못된 주소일 수 있습니다.
            </p>
            <a th:href="@{/{code}/products(code=${company.code})}" class="btn btn-primary">
                <i class="fas fa-th-large"></i>
                상품 목록
            </a>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
