<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${post != null ? post.title : '게시글 상세'}">
    <title th:text="${post != null ? post.title + ' - ' + (company != null ? company.name : '') : '게시글 상세'}">게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 0;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .detail-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .detail-hero-content {
            position: relative;
            z-index: 1;
        }

        .detail-hero h1 {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .detail-hero p {
            font-size: 16px;
            opacity: 0.95;
        }

        .detail-section {
            max-width: 900px;
            margin: -40px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .detail-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .detail-header {
            padding: 40px;
            border-bottom: 2px solid #E5E7EB;
            background: linear-gradient(180deg, #F9FAFB 0%, #fff 100%);
        }

        .detail-title {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            color: #1F2937;
            margin: 0 0 24px;
            line-height: 1.4;
        }

        .detail-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            color: #6B7280;
            font-size: 14px;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-meta strong {
            color: #374151;
        }

        .detail-body {
            padding: 40px;
            min-height: 300px;
        }

        .detail-content {
            line-height: 1.9;
            color: #374151;
            font-size: 16px;
            white-space: pre-wrap;
        }

        .detail-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
        }

        .post-attachments {
            padding: 24px 32px;
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            border-radius: 16px;
            margin-top: 32px;
            border: 2px solid #BFDBFE;
        }

        .post-attachments strong {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #1E40AF;
            margin-bottom: 20px;
        }

        .post-attachments a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: #fff;
            border: 2px solid #BFDBFE;
            border-radius: 12px;
            color: #1E40AF;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .post-attachments a:hover {
            background: #DBEAFE;
            border-color: #1E40AF;
            transform: translateX(8px);
        }

        .detail-footer {
            padding: 40px;
            border-top: 2px solid #E5E7EB;
            text-align: center;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #1F2937;
            border: 2px solid #E5E7EB;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
            transform: translateY(-3px);
        }

        .error-message {
            text-align: center;
            padding: 100px 40px;
            background: #fff;
            border-radius: 20px;
        }

        .error-message i {
            font-size: 80px;
            color: #D1D5DB;
            margin-bottom: 24px;
        }

        .error-message h3 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .error-message p {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .detail-hero {
                padding: 40px 0;
            }

            .detail-section {
                margin-top: -30px;
            }

            .detail-header {
                padding: 28px 24px;
            }

            .detail-title {
                font-size: 24px;
            }

            .detail-body {
                padding: 28px 24px;
            }

            .detail-content {
                font-size: 15px;
            }

            .detail-footer {
                flex-direction: column;
                padding: 28px 24px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <div th:replace="~{layout/layout :: header}"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <!-- 히어로 섹션 -->
        <div class="detail-hero" th:if="${post != null}">
            <div class="detail-hero-content">
                <h1 th:text="${board != null ? board.name : '게시글'}">게시판</h1>
                <p th:text="${#temporals.format(post.createdAt, 'yyyy년 MM월 dd일 HH:mm')}">등록일</p>
            </div>
        </div>

        <!-- 상세 섹션 -->
        <div class="detail-section" th:if="${post != null}">
            <article class="detail-card">
                <!-- 헤더 -->
                <header class="detail-header">
                    <h2 class="detail-title" th:text="${post.title}">게시글 제목</h2>
                    <div class="detail-meta">
                        <span>
                            <i class="fas fa-user"></i>
                            작성자: <strong th:text="${post.author}">작성자</strong>
                        </span>
                        <span>
                            <i class="fas fa-calendar-alt"></i>
                            작성일: <strong th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</strong>
                        </span>
                        <span>
                            <i class="fas fa-eye"></i>
                            조회수: <strong th:text="${post.viewCount}">조회수</strong>
                        </span>
                    </div>
                </header>

                <!-- 본문 -->
                <div class="detail-body">
                    <div class="detail-content" th:text="${post.content}">내용</div>
                </div>

                <!-- 첨부파일 -->
                <div class="post-attachments" th:if="${post.filePath}">
                    <strong><i class="fas fa-paperclip"></i> 첨부파일</strong>
                    <a th:href="${post.filePath}" download>
                        <i class="fas fa-download"></i>
                        파일 다운로드
                    </a>
                </div>

                <!-- 푸터 -->
                <div class="detail-footer">
                    <a th:href="@{/{code}/board/{type}(code=${company.code},type=${board.type})}" class="btn btn-secondary">
                        <i class="fas fa-list"></i>
                        목록으로
                    </a>
                    <button class="btn btn-primary" onclick="sharePost()">
                        <i class="fas fa-share-alt"></i>
                        공유하기
                    </button>
                </div>
            </article>
        </div>

        <!-- 오류 메시지 -->
        <div class="error-message" th:unless="${post != null}">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>게시글을 찾을 수 없습니다</h3>
            <p th:text="${message != null ? message : '요청하신 게시글을 찾을 수 없습니다. 삭제되었거나 잘못된 주소일 수 있습니다.'}">
                요청하신 게시글을 찾을 수 없습니다. 삭제되었거나 잘못된 주소일 수 있습니다.
            </p>
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a th:href="@{/{code}/board/{type}(code=${company.code},type=${board.type})}" th:if="${board != null}" class="btn btn-primary">
                    <i class="fas fa-list"></i>
                    목록으로
                </a>
                <a th:href="@{/{code}(code=${company.code})}" class="btn btn-secondary">
                    <i class="fas fa-home"></i>
                    홈으로
                </a>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <div th:replace="~{layout/layout :: footer}"></div>

    <script th:src="@{/js/common.js}"></script>
    <script>
        function sharePost() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(console.error);
            } else {
                const tempInput = document.createElement('input');
                tempInput.value = window.location.href;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                alert('링크가 복사되었습니다!');
            }
        }
    </script>
</body>
</html>
